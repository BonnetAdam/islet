name: Islet
options:
  bundleIdPrefix: ch.rubencatalao
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
packages:
  IsletKit:
    path: Packages/IsletKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - App
      - path: MediaBridge/media-bridge.pl
        buildPhase: resources
    dependencies:
      - package: IsletKit
        product: IsletShell
      # The `islet` command, in Contents/Helpers: next to the app's executable it would collide with "Islet",
      # since the disk ignores case.
      - target: IsletCommand
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Loaded by /usr/bin/perl at run time, never linked: it only ships in the bundle's resources.
      - target: IsletMediaBridge
        link: false
        embed: true
        copy:
          destination: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Islet
        CFBundleDisplayName: Islet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        LSMinimumSystemVersion: "14.0"
        # Lives in the notch: no Dock icon, no main menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Ruben Catalao. MIT License. Islet is not affiliated with Apple."
        NSCalendarsFullAccessUsageDescription: Islet shows your next events in the notch.
        NSCameraUsageDescription: Islet uses the camera only when you open its mirror.
        NSBluetoothAlwaysUsageDescription: Islet reads the battery of your AirPods and other headphones.
        NSRemindersFullAccessUsageDescription: Islet shows the reminders due today beside your agenda.
        CFBundleURLTypes:
          - CFBundleURLName: ch.rubencatalao.islet
            CFBundleURLSchemes: [islet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.islet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  IsletMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: MediaBridge/IsletMediaBridge.m
    settings:
      base:
        PRODUCT_NAME: IsletMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: -framework Foundation
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
  # Named apart from the app: the disk ignores case, so "islet" and "Islet" would collide.
  IsletCommand:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: islet
        PRODUCT_MODULE_NAME: IsletCommand
        SKIP_INSTALL: YES
