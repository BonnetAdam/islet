name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test IsletKit
        run: swift test --package-path Packages/IsletKit
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Islet.app (ad hoc signature)
        run: scripts/build.sh Debug
